name: Build and Deploy to EKS

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: posthoot
  EKS_CLUSTER: posthoot-prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER

    - name: Deploy to EKS
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Update image in deployment
        kubectl set image deployment/posthoot \
          posthoot=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
          -n posthoot

        # Wait for rollout
        kubectl rollout status deployment/posthoot -n posthoot --timeout=5m

        # Verify deployment
        kubectl get pods -n posthoot

    - name: Verify health
      run: |
        # Get ALB endpoint
        ALB=$(kubectl get ingress posthoot-ingress -n posthoot -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

        # Wait for health check
        for i in {1..30}; do
          if curl -f http://$ALB/health; then
            echo "Health check passed"
            exit 0
          fi
          echo "Waiting for health check... ($i/30)"
          sleep 10
        done

        echo "Health check failed"
        exit 1

    - name: Rollback on failure
      if: failure()
      run: |
        kubectl rollout undo deployment/posthoot -n posthoot
        kubectl rollout status deployment/posthoot -n posthoot
