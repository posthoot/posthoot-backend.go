---
apiVersion: v1
kind: Namespace
metadata:
  name: posthoot

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: posthoot-config
  namespace: posthoot
data:
  # Add your config here
  PORT: "9001"
  INFISICAL_PROJECT_ID: "7350b754-2ba4-46c3-9551-6c307415627d"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: posthoot
  namespace: posthoot
spec:
  replicas: 3
  selector:
    matchLabels:
      app: posthoot
  template:
    metadata:
      labels:
        app: posthoot
    spec:
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: posthoot
      containers:
        - name: posthoot
          image: theboringhumane/xemgo:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9001
              name: http
          envFrom:
            - secretRef:
                name: infisical-secrets
            - configMapRef:
                name: posthoot-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 9001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 9001
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: posthoot
  namespace: posthoot
spec:
  selector:
    app: posthoot
  ports:
    - port: 80
      targetPort: 9001
      protocol: TCP
  type: ClusterIP

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: posthoot-pdb
  namespace: posthoot
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: posthoot
